name: crash-pipeline-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint deps
        run: pip install ruff
      - name: Ruff check
        run: ruff check extract load dags
      - name: Ruff format check
        run: ruff format --check extract load dags

  dbt-parse:
    name: dbt parse (no warehouse)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: dummy_ci_password
      POSTGRES_DATABASE_NAME: NZTrafficCrashData
      DBT_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt deps
        run: pip install -r requirements-ci.txt
      - name: dbt deps
        working-directory: dbt/NZCrashData
        run: dbt deps
      - name: dbt parse
        working-directory: dbt/NZCrashData
        run: dbt parse --profiles-dir .

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
