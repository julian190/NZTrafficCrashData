version: 2

models:
  - name: stg_nz_traffic_crash
    description: >
      Staging layer model for the NZ Traffic Crash dataset. Cleaned, cast, and renamed columns.
    columns:
      - name: crash_id
        description: "Unique identifier for each crash event (primary key)."
        tests:
          - unique
          - not_null
      - name: fatal_count
        description: "Number of fatalities in the crash."
        tests:
          - not_null
      - name: serious_injury_count
        description: "Number of serious injuries in the crash."
        tests:
          - not_null
      - name: minor_injury_count
        description: "Number of minor injuries in the crash."
        tests:
          - not_null
      - name: crash_severity
        description: "Severity category of the crash (e.g. Fatal, Serious, Minor, Non-Injury)."
        tests:
          - not_null
